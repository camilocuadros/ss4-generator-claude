version: '3.8'

services:
  ss4-api:
    build: .
    container_name: ss4-form-filler-api
    ports:
      - "8000:8000"
    volumes:
      # Solo necesitas montar el template del formulario
      # Los PDFs se generan en memoria y se envían directamente al usuario
      - ./templates:/app/templates:ro  # read-only para seguridad
    environment:
      - TEMPLATE_PATH=/app/templates/1_updated_fss4.pdf
      - MAPPING_PATH=/app/ss4_field_mapping.json
      # OUTPUT_DIR ya no es necesario - se usa /tmp automáticamente
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
